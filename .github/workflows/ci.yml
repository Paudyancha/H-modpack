name: CI for H-modpack
on:
  workflow_dispatch:
  push:
    branches:
      - release/**
      - dev/**
    paths:
      - .github/workflows/ci.yml
      - mods/**
      - index.toml


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: CheckOut
        uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'

      - name: Install Packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: pack curseforge
        run: packwiz curseforge export

      - name: Read TOML
        id: toml
        uses: Gu-ZT/toml-reader-action@main
        with:
          file: pack.toml
          fields: |
            package.name
            package.version

      - name: Echo toml
        run: |
          echo ${{ steps.toml.outputs.package_name }}
          echo ${{ steps.toml.outputs.package_version }}

      - name: capture build artifacts
        uses: actions/upload-artifact@v4.3.3
        with:
          name: "${{ steps.toml.outputs.package_name }}-${{ steps.toml.outputs.package_version }}"
          path: |
            ./${{ steps.toml.outputs.package_name }}-${{ steps.toml.outputs.package_version }}.zip
            
            
     
            
        
