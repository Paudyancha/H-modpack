name: CI for H-modpack
on:
  workflow_dispatch:
  push:
    branches:
      - release/**
      - dev/**
      - main
    paths:
      - ./.github/workflows/ci.yml
      - mods/**
      - .packwizignore
      - build.sh
      - index.toml
      - pack.toml


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: CheckOut
        uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'

      - name: Install Packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Read TOML
        id: toml
        uses: Gu-ZT/toml-reader-action@main
        with:
          file: pack.toml
          fields: |
            name
            version

      - name: pack curseforge
        env:
          PACK_NAME: ${{ steps.toml.outputs.name }}
          PACK_VERSION: ${{ steps.toml.outputs.version }}
        run: bash ./build.sh

      - name: capture build artifacts
        uses: actions/upload-artifact@v4.3.3
        with:
          name: "${{ steps.toml.outputs.name }}-${{ steps.toml.outputs.version }}"
          path: |
            ./dist/${{ steps.toml.outputs.name }}-${{ steps.toml.outputs.version }}-client.zip
            ./dist/${{ steps.toml.outputs.name }}-${{ steps.toml.outputs.version }}-server.zip
            
            
     
            
        
